<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Coming soon</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1c1c1c; --muted: #8a8a8a; --rule: #d9d9d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --fg: #ededed; --muted: #7a7a7a; --rule: #2e2e2e; }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    -webkit-font-smoothing: antialiased;
  }
  main { text-align: center; }
  h1 { font-size: clamp(1.5rem, 4vw, 2.25rem); font-weight: 500; letter-spacing: -0.01em; }
  hr { width: 32px; border: 0; border-top: 1px solid var(--rule); margin: 28px auto; }
  p { font-size: 0.95rem; color: var(--muted); line-height: 1.6; }
  a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--rule); }
  a:hover { border-bottom-color: var(--fg); }
</style>
</head>
<body>
  <main>
    <h1>Coming soon.</h1>
    <hr>
    <p>Inquiries<br><a href="mailto:founders@deadsimple.casa">founders@deadsimple.casa</a></p>
  </main>
</body>
</html>
